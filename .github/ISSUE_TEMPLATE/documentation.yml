name: Documentation
description: Correct or extend a project document.
title: "docs: "
labels: [documentation]
body:
  - type: input
    id: document
    attributes: {label: Document}
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: Problem and missing evidence}
    validations: {required: true}
  - type: textarea
    id: correction
    attributes: {label: Proposed correction and supporting source}
    validations: {required: true}

