[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ae-bci"
version = "0.1.0"
description = "Analysis tools for acoustoelectric heterodyne neural-recording experiments."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "LicenseRef-TBD"}
authors = [{name = "AE-BCI contributors"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "mypy>=1.8",
  "mkdocs-material>=9.5",
]

[project.scripts]
ae-bci-sidebands = "ae_bci.cli:sidebands_main"
ae-bci-validate = "ae_bci.cli:validate_main"

[tool.setuptools]
package-dir = {"" = "software"}

[tool.setuptools.packages.find]
where = ["software"]

[tool.pytest.ini_options]
testpaths = ["software/tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ae_bci"]
mypy_path = "software"

